<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>WorkMind V5.2</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f4f6;
color:#111827;
margin:0
}

main{
max-width:760px;
margin:auto;
padding:18px
}

.card{
background:white;
border-radius:18px;
padding:18px;
margin:12px 0;
box-shadow:0 2px 12px #0001
}

button{
border:0;
border-radius:12px;
padding:13px 16px;
font-weight:700;
font-size:16px;
margin:4px;
background:#111827;
color:white
}

.secondary{
background:#e5e7eb;
color:#111827
}

.danger{
background:#b42318
}

textarea,input{
width:100%;
box-sizing:border-box;
padding:12px;
border:1px solid #d1d5db;
border-radius:12px;
font-size:16px
}

.badge{
background:#e5e7eb;
border-radius:999px;
padding:5px 9px;
font-size:12px
}

.count{
font-size:13px;
background:#f3f4f6;
padding:4px 8px;
border-radius:999px
}

.item{
border-top:1px solid #eee;
padding:12px 0
}

.item:first-child{
border-top:0
}

small{
color:#6b7280
}

pre{
white-space:pre-wrap;
font-size:12px
}

.good{color:#067647}
.bad{color:#b42318}

.empty{
color:#6b7280;
font-size:14px
}

.event{
font-size:13px;
padding:8px 0;
border-top:1px solid #eee
}

</style>

</head>

<body>

<main>

<h1>
WorkMind
<span class="badge">
V5.2 · Supervisor
</span>
</h1>

<p>
<small>
Operational memory & task lifecycle
</small>
</p>

<div class="card">

<h2>Workday</h2>

<button
id="start"
onclick="toggle()"
>
Start Workday
</button>

<p id="status">
Not recording.
</p>

<textarea
id="manual"
rows="4"
placeholder="Tell WorkMind what is happening..."
></textarea>

<button
class="secondary"
onclick="manual()"
>
Analyze Text
</button>

</div>

<div class="card">

<h2>
My Tasks
<span
class="count"
id="myCount"
>0</span>
</h2>

<div id="myTasks"></div>

</div>

<div class="card">

<h2>
Team Tasks
<span
class="count"
id="teamCount"
>0</span>
</h2>

<div id="teamTasks"></div>

</div>

<div class="card">

<h2>
Completed Work
<span
class="count"
id="completedCount"
>0</span>
</h2>

<div id="completed"></div>

</div>

<div class="card">

<h2>
Shift Notes
<span
class="count"
id="noteCount"
>0</span>
</h2>

<div id="notes"></div>

</div>

<div class="card">

<h2>Ask WorkMind</h2>

<input
id="q"
placeholder="What happened with Pump 12 today?"
>

<button onclick="ask()">
Ask
</button>

<p id="answer"></p>

</div>

<div class="card">

<h2>Activity History</h2>

<div id="events"></div>

</div>

<div class="card">

<h2>Transcript</h2>

<pre id="transcript"></pre>

</div>

<div class="card">

<h2>Diagnostics</h2>

<div id="health">
Checking…
</div>

<button
class="secondary"
onclick="runTest()"
>
Check V5.2 Engine
</button>

<pre id="test"></pre>

</div>

<div class="card">

<h2>Workday Data</h2>

<button
class="danger"
onclick="clearDay()"
>
Clear Workday
</button>

</div>

</main>

<script>

const $ =
x => document.getElementById(x);

let rec;
let stream;
let on=false;

let transcript =
localStorage.wm52_transcript || "";

let state;

try{

state =
JSON.parse(
localStorage.wm52_state || "{}"
);

}catch{

state={};

}

state.myTasks ||= [];
state.teamTasks ||= [];
state.completedWork ||= [];
state.notes ||= [];
state.events ||= [];

/* ---------- UTILITIES ---------- */

function id(){

return (
Date.now().toString(36) +
Math.random()
.toString(36)
.slice(2,8)
);

}

function esc(s){

return String(s??"")
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}

function clean(v){

if(
v===null ||
v===undefined
)return null;

let s=
String(v).trim();

if(
!s ||
s==='""' ||
s==="''" ||
s.toLowerCase()==="null" ||
s.toLowerCase()==="none"
){
return null;
}

return s;

}

function norm(v){

return String(v||"")
.toLowerCase()
.replace(/[^a-z0-9 ]/g,"")
.replace(/\s+/g," ")
.trim();

}

function save(){

localStorage.wm52_transcript =
transcript;

localStorage.wm52_state =
JSON.stringify(state);

render();

}

function addEvent(
type,
text,
taskId=null
){

state.events.unshift({

id:id(),
type,
text,
taskId,
time:
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)

});

}

/* ---------- FIND TASK ---------- */

function findTask(targetId){

let i=
state.myTasks
.findIndex(
x=>x.id===targetId
);

if(i>=0){

return {
list:state.myTasks,
index:i,
task:state.myTasks[i],
category:"myTasks"
};

}

i=
state.teamTasks
.findIndex(
x=>x.id===targetId
);

if(i>=0){

return {
list:state.teamTasks,
index:i,
task:state.teamTasks[i],
category:"teamTasks"
};

}

return null;

}

/* ---------- APPLY AI ACTION ---------- */

function applyAction(a){

a.title=clean(a.title);
a.owner=clean(a.owner);
a.due=clean(a.due);
a.details=clean(a.details);
a.targetId=clean(a.targetId);

switch(a.action){

case "CREATE_MY_TASK":{

if(!a.title)return;

const duplicate=
state.myTasks.some(
x=>norm(x.title)===norm(a.title)
);

if(duplicate)return;

const task={
id:id(),
title:a.title,
owner:"Me",
due:a.due,
details:a.details,
confidence:a.confidence
};

state.myTasks.push(task);

addEvent(
"CREATE",
`Created my task: ${task.title}`,
task.id
);

break;
}

case "CREATE_TEAM_TASK":{

if(!a.title)return;

const duplicate=
state.teamTasks.some(
x=>
norm(x.title)===norm(a.title) &&
norm(x.owner)===norm(a.owner)
);

if(duplicate)return;

const task={
id:id(),
title:a.title,
owner:a.owner,
due:a.due,
details:a.details,
confidence:a.confidence
};

state.teamTasks.push(task);

addEvent(
"CREATE",
`Assigned ${task.title}${
task.owner
?" to "+task.owner
:""
}`,
task.id
);

break;
}

case "UPDATE_TASK":{

const found=
findTask(a.targetId);

if(!found)return;

const before={
...found.task
};

if(a.title)
found.task.title=a.title;

if(a.due)
found.task.due=a.due;

if(a.details)
found.task.details=a.details;

addEvent(
"UPDATE",
`Updated ${found.task.title}${
before.due!==found.task.due
?`: due changed from ${
before.due||"unspecified"
} to ${
found.task.due||"unspecified"
}`
:""
}`,
found.task.id
);

break;
}

case "REASSIGN_TASK":{

const found=
findTask(a.targetId);

if(!found || !a.owner)return;

const oldOwner=
found.task.owner || "Me";

const task={
...found.task,
owner:a.owner
};

found.list.splice(
found.index,
1
);

state.teamTasks.push(task);

addEvent(
"REASSIGN",
`${task.title} reassigned from ${oldOwner} to ${a.owner}`,
task.id
);

break;
}

case "COMPLETE_TASK":{

const found=
findTask(a.targetId);

if(!found)return;

const task=
found.task;

found.list.splice(
found.index,
1
);

state.completedWork.unshift({

id:id(),

sourceTaskId:
task.id,

title:
a.title ||
task.title,

owner:
a.owner ||
task.owner,

details:
a.details ||
task.details ||
"Completed.",

time:
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)

});

addEvent(
"COMPLETE",
`${task.title} completed${
task.owner
?" by "+task.owner
:""
}`,
task.id
);

break;
}

case "CANCEL_TASK":{

const found=
findTask(a.targetId);

if(!found)return;

const task=
found.task;

found.list.splice(
found.index,
1
);

addEvent(
"CANCEL",
`${task.title} cancelled`,
task.id
);

break;
}

case "ADD_COMPLETED_WORK":{

if(!a.title)return;

const duplicate=
state.completedWork.some(
x=>
norm(x.title)===
norm(a.title)
);

if(duplicate)return;

state.completedWork.unshift({

id:id(),
sourceTaskId:null,
title:a.title,
owner:a.owner,
details:a.details,
time:
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)

});

addEvent(
"COMPLETE",
a.title
);

break;
}

case "ADD_NOTE":{

if(!a.title)return;

const duplicate=
state.notes.some(
x=>norm(x.title)===norm(a.title)
);

if(duplicate)return;

state.notes.unshift({

id:id(),
title:a.title,
details:a.details,
time:
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)

});

addEvent(
"NOTE",
a.title
);

break;
}

}

}

/* ---------- RENDER ---------- */

function taskHTML(
task,
index,
category
){

return `

<div class="item">

<label>

<input
type="checkbox"
onchange="
manualComplete(
'${category}',
${index}
)
"
>

<b>
${esc(task.title)}
</b>

</label>

<br>

<small>

${category==="myTasks"
?"Me"
:esc(task.owner||"Unassigned")}

${task.due
?" · Due: "+esc(task.due)
:""}

${task.details
?" · "+esc(task.details)
:""}

</small>

</div>

`;

}

function render(){

$("transcript").textContent=
transcript ||
"No transcript yet.";

$("myCount").textContent=
state.myTasks.length;

$("teamCount").textContent=
state.teamTasks.length;

$("completedCount").textContent=
state.completedWork.length;

$("noteCount").textContent=
state.notes.length;

$("myTasks").innerHTML=
state.myTasks.length
?state.myTasks
.map(
(t,i)=>
taskHTML(
t,
i,
"myTasks"
)
)
.join("")
:'<div class="empty">No outstanding personal tasks.</div>';

$("teamTasks").innerHTML=
state.teamTasks.length
?state.teamTasks
.map(
(t,i)=>
taskHTML(
t,
i,
"teamTasks"
)
)
.join("")
:'<div class="empty">No outstanding team tasks.</div>';

$("completed").innerHTML=
state.completedWork.length
?state.completedWork
.map(
x=>`

<div class="item">

<b>${esc(x.title)}</b>

<br>

<small>

${x.owner
?"By: "+esc(x.owner)
:""}

${x.details
?(x.owner?" · ":"")+esc(x.details)
:""}

${x.time
?" · "+esc(x.time)
:""}

</small>

</div>

`
)
.join("")
:'<div class="empty">No completed work recorded.</div>';

$("notes").innerHTML=
state.notes.length
?state.notes
.map(
x=>`

<div class="item">

<b>
${esc(x.title)}
</b>

<br>

<small>

${x.details
?esc(x.details)
:""}

${x.time
?(x.details?" · ":"")+esc(x.time)
:""}

</small>

</div>

`
)
.join("")
:'<div class="empty">No shift notes yet.</div>';

$("events").innerHTML=
state.events.length
?state.events
.slice(0,50)
.map(
e=>`

<div class="event">

<b>${esc(e.time)}</b>
·
${esc(e.text)}

</div>

`
)
.join("")
:'<div class="empty">No activity yet.</div>';

}

/* ---------- MANUAL COMPLETION ---------- */

function manualComplete(
category,
index
){

const list=
state[category];

const task=
list[index];

if(!task)return;

list.splice(index,1);

state.completedWork.unshift({

id:id(),

sourceTaskId:
task.id,

title:
task.title,

owner:
category==="myTasks"
?"Me"
:task.owner,

details:
"Marked complete manually.",

time:
new Date()
.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit"
}
)

});

addEvent(
"COMPLETE",
`${task.title} marked complete`,
task.id
);

save();

}

/* ---------- ANALYSIS ---------- */

async function analyze(text){

const context=
transcript.slice(-10000);

transcript +=
(transcript?"\n":"") +
text;

save();

$("status").textContent=
"Analyzing work…";

try{

const response=
await fetch(
"/api/extract",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:
JSON.stringify({
transcript:text,
context,
state
})
}
);

const result=
await response.json();

if(!response.ok){
throw Error(result.error);
}

for(
const action of
result.actions||[]
){

applyAction(action);

}

save();

$("status").textContent=
on
?"Listening — processing about every 30 seconds."
:"Analysis complete.";

}catch(e){

$("status").textContent=
"AI error: "+e.message;

}

}

/* ---------- MANUAL TEXT ---------- */

async function manual(){

const text=
$("manual")
.value
.trim();

if(!text)return;

$("manual").value="";

await analyze(text);

}

/* ---------- AUDIO ---------- */

async function toggle(){

if(on){

rec.stop();

stream
.getTracks()
.forEach(
t=>t.stop()
);

on=false;

$("start").textContent=
"Start Workday";

$("status").textContent=
"Finishing last audio…";

return;

}

try{

stream=
await navigator
.mediaDevices
.getUserMedia({
audio:true
});

const mime=
MediaRecorder
.isTypeSupported(
"audio/webm;codecs=opus"
)
?"audio/webm;codecs=opus"
:"audio/webm";

rec=
new MediaRecorder(
stream,
{
mimeType:mime
}
);

rec.ondataavailable=
e=>{

if(e.data.size>1000){
audio(e.data);
}

};

rec.onstop=()=>{

$("status").textContent=
"Workday stopped.";

};

rec.start(30000);

on=true;

$("start").textContent=
"Stop Workday";

$("status").textContent=
"Listening — processing about every 30 seconds.";

}catch(e){

$("status").textContent=
"Microphone error: "+
e.message;

}

}

async function audio(blob){

$("status").textContent=
"Transcribing…";

try{

const bytes=
new Uint8Array(
await blob.arrayBuffer()
);

let binary="";

for(const b of bytes){
binary+=
String.fromCharCode(b);
}

const response=
await fetch(
"/api/transcribe",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:
JSON.stringify({
audioBase64:
btoa(binary),
format:"webm"
})
}
);

const result=
await response.json();

if(!response.ok){
throw Error(result.error);
}

if(result.text?.trim()){

await analyze(
result.text.trim()
);

}

$("status").textContent=
on
?"Listening — processing about every 30 seconds."
:"Workday stopped.";

}catch(e){

$("status").textContent=
"AI error: "+
e.message;

}

}

/* ---------- ASK ---------- */

async function ask(){

const question=
$("q")
.value
.trim();

if(!question)return;

$("answer").textContent=
"Thinking…";

try{

const response=
await fetch(
"/api/ask",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:
JSON.stringify({
question,
transcript,
state
})
}
);

const result=
await response.json();

$("answer").textContent=
result.answer ||
result.error ||
"No answer.";

}catch(e){

$("answer").textContent=
e.message;

}

}

/* ---------- HEALTH ---------- */

async function health(){

try{

const j=
await(
await fetch(
"/api/health"
)
).json();

$("health").innerHTML=

`<span class="good">
Server online · V${esc(j.version)}
</span>

<br>

<small>
${esc(j.mode||"")}
<br>
AI key:
${j.apiKeyConfigured
?"configured"
:"MISSING"}
<br>
${esc(j.chatModel)}
<br>
${esc(j.transcriptionModel)}
</small>`;

}catch{

$("health").innerHTML=
'<span class="bad">Server unreachable</span>';

}

}

async function runTest(){

$("test").textContent=
"Checking…";

try{

const j=
await(
await fetch(
"/api/self-test"
)
).json();

$("test").textContent=
JSON.stringify(
j,
null,
2
);

}catch(e){

$("test").textContent=
e.message;

}

}

/* ---------- CLEAR ---------- */

function clearDay(){

if(
!confirm(
"Clear the entire WorkMind workday?"
)
)return;

transcript="";

state={
myTasks:[],
teamTasks:[],
completedWork:[],
notes:[],
events:[]
};

save();

$("status").textContent=
"Workday cleared.";

}

/* ---------- START ---------- */

health();
render();

</script>

</body>
</html>
