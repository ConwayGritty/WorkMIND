<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WorkMind V5</title>
<style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;color:#111827;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;margin:4px;background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.badge{background:#e5e7eb;border-radius:999px;padding:5px 9px;font-size:12px}.task{border-top:1px solid #eee;padding:12px 0}small{color:#6b7280}pre{white-space:pre-wrap;font-size:12px}.good{color:#067647}.bad{color:#b42318}</style></head>
<body><main><h1>WorkMind <span class="badge">V5 · OpenRouter</span></h1>
<div class="card"><h2>Diagnostics</h2><div id="health">Checking…</div><button onclick="runTest()">Run Full Test</button><pre id="test"></pre></div>
<div class="card"><h2>Workday</h2><button id="start" onclick="toggle()">Start Workday</button><p id="status">Not recording.</p><textarea id="manual" rows="4" placeholder='Supervisor: "Check Pump 12." Me: "Yep, I’ll do that."'></textarea><button class="secondary" onclick="manual()">Analyze Text</button></div>
<div class="card"><h2>Tasks</h2><div id="tasks"></div></div>
<div class="card"><h2>Ask WorkMind</h2><input id="q" placeholder="What did I say I’d do before lunch?"><button onclick="ask()">Ask</button><p id="answer"></p></div>
<div class="card"><h2>Transcript</h2><pre id="transcript"></pre></div></main>
<script>
let rec,stream,on=false,transcript=localStorage.wm_transcript||"",tasks=JSON.parse(localStorage.wm_tasks||"[]");const $=x=>document.getElementById(x);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){localStorage.wm_transcript=transcript;localStorage.wm_tasks=JSON.stringify(tasks);render()}
function render(){$("transcript").textContent=transcript||"No transcript yet.";$("tasks").innerHTML=tasks.length?tasks.map((t,i)=>`<div class="task"><label><input type="checkbox" ${t.done?"checked":""} onchange="done(${i},this.checked)"> <b>${esc(t.title)}</b></label><br><small>${t.due?"Due: "+esc(t.due)+" · ":""}Confidence ${Math.round((t.confidence||0)*100)}% · ${esc(t.reason||"")}</small></div>`).join(""):"No tasks yet."}
function done(i,v){tasks[i].done=v;save()}
async function health(){try{let j=await(await fetch("/api/health")).json();$("health").innerHTML=`<span class="good">Server online</span><br><small>AI key: ${j.apiKeyConfigured?"configured":"MISSING"} · ${esc(j.chatModel)} · ${esc(j.transcriptionModel)}</small>`}catch{$("health").innerHTML='<span class="bad">Server unreachable</span>'}}
async function runTest(){$("test").textContent="Running live AI tests…";try{$("test").textContent=JSON.stringify(await(await fetch("/api/self-test")).json(),null,2)}catch(e){$("test").textContent=e.message}}
async function toggle(){if(on){rec.stop();stream.getTracks().forEach(t=>t.stop());on=false;$("start").textContent="Start Workday";$("status").textContent="Stopped.";return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm"});rec.ondataavailable=e=>{if(e.data.size>1000)audio(e.data)};rec.start(30000);on=true;$("start").textContent="Stop Workday";$("status").textContent="Listening — processing about every 30 seconds."}catch(e){$("status").textContent="Microphone error: "+e.message}}
async function audio(blob){$("status").textContent="Transcribing…";try{let b=new Uint8Array(await blob.arrayBuffer()),bin="";for(let x of b)bin+=String.fromCharCode(x);let r=await fetch("/api/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audioBase64:btoa(bin),format:"webm"})}),j=await r.json();if(!r.ok)throw Error(j.error);if(j.text?.trim())await analyze(j.text.trim());$("status").textContent=on?"Listening — processing about every 30 seconds.":"Stopped."}catch(e){$("status").textContent="AI error: "+e.message}}
async function manual(){let t=$("manual").value.trim();if(t){await analyze(t);$("manual").value=""}}
async function analyze(text){let context=transcript.slice(-6000);transcript+=(transcript?"\n":"")+text;save();let r=await fetch("/api/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({transcript:text,context,existingTasks:tasks.filter(x=>!x.done)})}),j=await r.json();if(!r.ok){alert(j.error);return}for(let t of j.tasks||[])if(!tasks.some(x=>x.title.toLowerCase()===t.title.toLowerCase()&&!x.done))tasks.push({...t,done:false});save()}
async function ask(){$("answer").textContent="Thinking…";let j=await(await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:$("q").value,transcript,tasks})})).json();$("answer").textContent=j.answer||j.error||"No answer."}
health();render();
</script></body></html>
