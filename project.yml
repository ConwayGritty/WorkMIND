name: WorkMIND
options:
  bundleIdPrefix: com.conwaygritty
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  WorkMIND:
    type: application
    platform: iOS
    sources:
      - path: WorkMIND
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conwaygritty.workmind
        PRODUCT_NAME: WorkMIND
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WorkMIND
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "WorkMIND uses the microphone to capture shift information."
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
